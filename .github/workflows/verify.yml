name: verify

# Runs the smoke test on every pull request and on main. It reads the
# repository and nothing else: no secrets, no org access, no write token.
# Fork pull requests run here under `pull_request`, never under
# `pull_request_target`, so their code gets this read-only token only.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - run: node scripts/smoke-test.mjs
